name: Smart Android CI with JDK Fallback

on:
  push:
    branches-ignore: 
      - 'gh-pages'
  pull_request: ~

jobs:
  detect-and-build:
    name: "Build on ${{ github.ref_name }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
        include:
          - java-version: 17
            jdk-id: jdk17
          - java-version: 21
            jdk-id: jdk21
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Auto-detect project setup
      id: detect-project
      run: |
        # Phát hiện cấu trúc dự án
        if [ -f "app/build.gradle" ]; then
          echo "ANDROID_ROOT=app" >> $GITHUB_OUTPUT
        elif [ -f "android/app/build.gradle" ]; then
          echo "ANDROID_ROOT=android/app" >> $GITHUB_OUTPUT
        else
          echo "::error::No Android project detected!"
          exit 1
        fi

        # Phát hiện build type từ commit message
        if [[ "$(git log -1 --pretty=%B)" == *"[release]"* ]]; then
          echo "BUILD_TYPE=release" >> $GITHUB_OUTPUT
        else
          echo "BUILD_TYPE=debug" >> $GITHUB_OUTPUT
        fi

        # Phát hiện JDK ưu tiên từ gradle.properties
        if [ -f "gradle.properties" ]; then
          if grep -q "javaToolchainVersion=21" gradle.properties; then
            echo "PREFERRED_JDK=21" >> $GITHUB_OUTPUT
          elif grep -q "javaToolchainVersion=17" gradle.properties; then
            echo "PREFERRED_JDK=17" >> $GITHUB_OUTPUT
          fi
        fi

    - name: Setup JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v3
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: 'gradle'

    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ matrix.java-version }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-${{ matrix.java-version }}-
          ${{ runner.os }}-gradle-

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platform-tools" "platforms;android-34"

    - name: Grant gradlew permissions
      run: chmod +x ./gradlew

    - name: Build with JDK ${{ matrix.java-version }}
      run: |
        ./gradlew assemble${{ steps.detect-project.outputs.BUILD_TYPE }} --stacktrace

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ steps.detect-project.outputs.BUILD_TYPE }}-jdk${{ matrix.java-version }}
        path: ${{ steps.detect-project.outputs.ANDROID_ROOT }}/build/outputs/apk/${{ steps.detect-project.outputs.BUILD_TYPE }}/*.apk
        retention-days: 7

  final-result:
    name: Build Summary
    needs: detect-and-build
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Determine successful build
      id: check-success
      run: |
        # Lấy kết quả từ các job
        success_jdk=""
        build_type=""
        
        # Kiểm tra job JDK 17
        if [[ '${{ needs.detect-and-build.result }}' == 'success' && '${{ needs.detect-and-build.outputs.PREFERRED_JDK }}' == '17' ]]; then
          success_jdk="17"
        # Kiểm tra job JDK 21
        elif [[ '${{ needs.detect-and-build.result }}' == 'success' && '${{ needs.detect-and-build.outputs.PREFERRED_JDK }}' == '21' ]]; then
          success_jdk="21"
        # Nếu không có JDK ưu tiên, chọn bất kỳ job thành công nào
        elif [[ '${{ needs.detect-and-build.result }}' == 'success' ]]; then
          success_jdk="${{ matrix.java-version }}"
        fi
        
        if [ -n "$success_jdk" ]; then
          echo "final-success=true" >> $GITHUB_OUTPUT
          echo "success-jdk=$success_jdk" >> $GITHUB_OUTPUT
          echo "build-type=${{ needs.detect-and-build.outputs.BUILD_TYPE }}" >> $GITHUB_OUTPUT
        else
          echo "final-success=false" >> $GITHUB_OUTPUT
          echo "::error::All build attempts failed!"
          exit 1
        fi

    - name: Download successful artifact
      if: steps.check-success.outputs.final-success == 'true'
      uses: actions/download-artifact@v4
      with:
        name: app-${{ steps.check-success.outputs.build-type }}-jdk${{ steps.check-success.outputs.success-jdk }}
        path: downloaded-artifact

    - name: Prepare final APK
      if: steps.check-success.outputs.final-success == 'true'
      run: |
        # Di chuyển APK vào vị trí cuối cùng
        mv downloaded-artifact/*.apk final-app.apk

    - name: Upload final APK
      if: steps.check-success.outputs.final-success == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: final-app
        path: final-app.apk
        retention-days: 14

    - name: Build Success Notification
      if: steps.check-success.outputs.final-success == 'true'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ Build succeeded with JDK ${{ steps.check-success.outputs.success-jdk }}! 
            Download: [final-app.apk](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts)`
          })

    - name: Build Failure Notification
      if: steps.check-success.outputs.final-success == 'false'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `❌ All build attempts failed! 
            Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          })
